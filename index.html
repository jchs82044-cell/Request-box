<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 및 로그인 건의함</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col items-center p-4">

    <div class="w-full max-w-2xl bg-white rounded-xl shadow-md overflow-hidden p-6 mt-6">
        <header class="mb-6 flex flex-col sm:flex-row justify-between items-center border-b pb-4 gap-3">
            <div>
                <h1 class="text-2xl font-bold text-gray-800">💡 온라인 건의함</h1>
                <p class="text-sm text-gray-500 mt-1">자유롭게 가입하고 로그인하여 의견을 남겨주세요.</p>
            </div>
            <!-- 로그인 상태 표시 및 버튼 영역 -->
            <div id="auth-status-container" class="flex items-center gap-2">
                <!-- 동적으로 변경됨 -->
            </div>
        </header>

        <!-- [로그인 전] 로그인 / 회원가입 탭 화면 -->
        <div id="auth-section" class="max-w-md mx-auto bg-blue-50/50 p-6 rounded-lg border border-blue-100">
            <!-- 탭 전환 버튼 -->
            <div class="flex mb-4 border-b border-blue-200">
                <button type="button" onclick="suggestionSystem.switchTab('login')" id="tab-login-btn"
                    class="flex-1 pb-2 font-semibold text-blue-600 border-b-2 border-blue-600 transition">로그인</button>
                <button type="button" onclick="suggestionSystem.switchTab('signup')" id="tab-signup-btn"
                    class="flex-1 pb-2 font-medium text-gray-500 hover:text-gray-700 transition">회원가입</button>
            </div>

            <!-- 로그인 폼 -->
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">아이디</label>
                    <input type="text" id="login-id" required placeholder="아이디를 입력하세요" 
                        class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 bg-white">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">비밀번호</label>
                    <input type="password" id="login-pw" required placeholder="비밀번호를 입력하세요" 
                        class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 bg-white">
                </div>
                <button type="submit" 
                    class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 transition font-medium">
                    로그인
                </button>
            </form>

            <!-- 회원가입 폼 (기본은 숨김) -->
            <form id="signup-form" class="space-y-4 hidden">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">사용할 아이디</label>
                    <input type="text" id="signup-id" placeholder="영문/숫자 조합 아이디" 
                        class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 bg-white">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">비밀번호</label>
                    <input type="password" id="signup-pw" placeholder="비밀번호 입력" 
                        class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 bg-white">
                </div>
                <button type="submit" 
                    class="w-full bg-emerald-600 text-white py-2 px-4 rounded-md hover:bg-emerald-700 transition font-medium">
                    회원가입 완료
                </button>
            </form>
        </div>

        <!-- [로그인 후] 건의 작성 화면 (기본은 숨김) -->
        <div id="suggestion-section" class="hidden space-y-4">
            <form id="suggestion-form" class="space-y-4 bg-blue-50/50 p-4 rounded-lg border border-blue-100">
                <div>
                    <label for="content-input" class="block text-sm font-medium text-gray-700 mb-1">건의 내용</label>
                    <textarea id="content-input" rows="3" required placeholder="내용을 입력하세요..." 
                        class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 bg-white"></textarea>
                </div>
                <button type="submit" 
                    class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 transition font-medium">
                    건의 등록하기
                </button>
            </form>
        </div>

        <hr class="my-6">

        <!-- 건의사항 목록 -->
        <section>
            <h2 class="text-lg font-semibold text-gray-800 mb-3">📋 등록된 건의사항 목록</h2>
            <div id="suggestion-list" class="space-y-3 max-h-96 overflow-y-auto pr-1">
                <!-- 건의사항이 동적으로 추가되는 영역 -->
            </div>
        </section>
    </div>

    <!-- 비밀번호 변경 모달 -->
    <div id="password-modal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-lg max-w-md w-full p-6">
            <h3 class="text-lg font-bold text-gray-800 mb-4">🔒 비밀번호 변경</h3>
            <form id="change-password-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">현재 비밀번호</label>
                    <input type="password" id="modal-current-pw" required 
                        class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">새 비밀번호</label>
                    <input type="password" id="modal-new-pw" required 
                        class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm">
                </div>
                <div class="flex space-x-2 pt-2">
                    <button type="button" onclick="suggestionSystem.closePasswordModal()" 
                        class="w-1/2 bg-gray-200 text-gray-700 py-2 rounded-md hover:bg-gray-300 transition">취소</button>
                    <button type="submit" 
                        class="w-1/2 bg-blue-600 text-white py-2 rounded-md hover:bg-blue-700 transition">변경하기</button>
                </div>
            </form>
        </div>
    </div>

    <!-- JavaScript 클래스 구현 -->
    <script>
        class SuggestionItem {
            constructor(author, content) {
                this.id = Date.now();
                this.author = author;
                this.content = content;
                this.date = new Date().toLocaleString();
            }
        }

        class SuggestionBoxSystem {
            constructor() {
                // users 객체 구조: { "아이디": "비밀번호", ... }
                this.users = JSON.parse(localStorage.getItem('custom_users')) || {};
                this.suggestions = JSON.parse(localStorage.getItem('custom_suggestions')) || [];
                this.currentUser = JSON.parse(localStorage.getItem('custom_currentUser')) || null;
            }

            saveData() {
                localStorage.setItem('custom_users', JSON.stringify(this.users));
                localStorage.setItem('custom_suggestions', JSON.stringify(this.suggestions));
                localStorage.setItem('custom_currentUser', JSON.stringify(this.currentUser));
            }

            signup(id, password) {
                if (!id.trim() || !password.trim()) {
                    alert('아이디와 비밀번호를 모두 입력해주세요.');
                    return false;
                }
                if (this.users[id]) {
                    alert('이미 존재하는 아이디입니다.');
                    return false;
                }
                this.users[id] = password;
                this.saveData();
                alert('회원가입이 완료되었습니다! 로그인해 주세요.');
                this.switchTab('login');
                return true;
            }

            login(id, password) {
                if (!this.users[id] || this.users[id] !== password) {
                    alert('아이디 또는 비밀번호가 올바르지 않습니다.');
                    return false;
                }
                this.currentUser = id;
                this.saveData();
                this.updateUIState();
                return true;
            }

            logout() {
                this.currentUser = null;
                this.saveData();
                this.updateUIState();
            }

            changePassword(currentPw, newPw) {
                if (!this.currentUser) return;
                if (this.users[this.currentUser] !== currentPw) {
                    alert('현재 비밀번호가 일치하지 않습니다.');
                    return false;
                }
                this.users[this.currentUser] = newPw;
                this.saveData();
                alert('비밀번호가 변경되었습니다!');
                return true;
            }

            addSuggestion(content) {
                if (!this.currentUser) {
                    alert('로그인이 필요합니다.');
                    return false;
                }
                const newItem = new SuggestionItem(this.currentUser, content);
                this.suggestions.unshift(newItem);
                this.saveData();
                return true;
            }

            deleteSuggestion(id, author) {
                // 본인이 작성한 글이거나 관리자일 때 작성자 비밀번호 확인
                const pw = prompt(`'${author}' 님의 비밀번호를 입력해주세요:`);
                if (pw === null) return;

                if (this.users[author] !== pw) {
                    alert('비밀번호가 일치하지 않습니다.');
                    return;
                }

                this.suggestions = this.suggestions.filter(item => item.id !== id);
                this.saveData();
                this.render();
            }

            switchTab(type) {
                const loginForm = document.getElementById('login-form');
                const signupForm = document.getElementById('signup-form');
                const loginBtn = document.getElementById('tab-login-btn');
                const signupBtn = document.getElementById('tab-signup-btn');

                if (type === 'login') {
                    loginForm.classList.remove('hidden');
                    signupForm.classList.add('hidden');
                    loginBtn.className = 'flex-1 pb-2 font-semibold text-blue-600 border-b-2 border-blue-600 transition';
                    signupBtn.className = 'flex-1 pb-2 font-medium text-gray-500 hover:text-gray-700 transition';
                } else {
                    loginForm.classList.add('hidden');
                    signupForm.classList.remove('hidden');
                    signupBtn.className = 'flex-1 pb-2 font-semibold text-emerald-600 border-b-2 border-emerald-600 transition';
                    loginBtn.className = 'flex-1 pb-2 font-medium text-gray-500 hover:text-gray-700 transition';
                }
            }

            updateUIState() {
                const authSection = document.getElementById('auth-section');
                const suggestionSection = document.getElementById('suggestion-section');
                const authStatusContainer = document.getElementById('auth-status-container');

                if (this.currentUser) {
                    authSection.classList.add('hidden');
                    suggestionSection.classList.remove('hidden');
                    authStatusContainer.innerHTML = `
                        <span class="text-sm font-semibold text-blue-600 bg-blue-50 px-3 py-1.5 rounded-md border border-blue-200">
                            👤 ${this.escapeHtml(this.currentUser)} 님
                        </span>
                        <button onclick="suggestionSystem.openPasswordModal()" 
                            class="bg-gray-200 text-gray-700 px-3 py-1.5 rounded-md text-sm hover:bg-gray-300 transition">
                            🔒 비번변경
                        </button>
                        <button onclick="suggestionSystem.logout()" 
                            class="bg-red-50 text-red-600 border border-red-200 px-3 py-1.5 rounded-md text-sm hover:bg-red-100 transition">
                            로그아웃
                        </button>
                    `;
                } else {
                    authSection.classList.remove('hidden');
                    suggestionSection.classList.add('hidden');
                    authStatusContainer.innerHTML = `<span class="text-sm text-gray-400">로그인되지 않았습니다.</span>`;
                }
                this.render();
            }

            render() {
                const container = document.getElementById('suggestion-list');
                container.innerHTML = '';

                if (this.suggestions.length === 0) {
                    container.innerHTML = `<p class="text-sm text-gray-400 text-center py-6">아직 등록된 건의사항이 없습니다.</p>`;
                    return;
                }

                this.suggestions.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'p-4 bg-gray-50 border border-gray-200 rounded-lg shadow-sm flex flex-col justify-between';
                    card.innerHTML = `
                        <div>
                            <div class="flex justify-between items-center mb-1">
                                <span class="font-semibold text-sm text-blue-600">👤 ${this.escapeHtml(item.author)}</span>
                                <div class="flex items-center space-x-2">
                                    <span class="text-xs text-gray-400">${item.date}</span>
                                    <button onclick="suggestionSystem.deleteSuggestion(${item.id}, '${item.author}')" 
                                        class="text-xs text-red-500 hover:text-red-700 bg-red-50 px-2 py-0.5 rounded border border-red-200">삭제</button>
                                </div>
                            </div>
                            <p class="text-sm text-gray-700 whitespace-pre-wrap mt-2">${this.escapeHtml(item.content)}</p>
                        </div>
                    `;
                    container.appendChild(card);
                });
            }

            openPasswordModal() {
                document.getElementById('password-modal').classList.remove('hidden');
            }

            closePasswordModal() {
                document.getElementById('password-modal').classList.add('hidden');
                document.getElementById('change-password-form').reset();
            }

            escapeHtml(str) {
                return str.replace(/[&<>'"]/g, 
                    tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
                );
            }
        }

        const suggestionSystem = new SuggestionBoxSystem();

        window.addEventListener('DOMContentLoaded', () => {
            suggestionSystem.updateUIState();
        });

        // 로그인 폼 이벤트
        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const id = document.getElementById('login-id').value;
            const pw = document.getElementById('login-pw').value;

            suggestionSystem.login(id, pw);
            document.getElementById('login-form').reset();
        });

        // 회원가입 폼 이벤트
        document.getElementById('signup-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const id = document.getElementById('signup-id').value;
            const pw = document.getElementById('signup-pw').value;

            suggestionSystem.signup(id, pw);
            document.getElementById('signup-form').reset();
        });

        // 건의사항 제출 폼 이벤트
        document.getElementById('suggestion-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const content = document.getElementById('content-input').value;

            if (suggestionSystem.addSuggestion(content)) {
                document.getElementById('content-input').value = '';
            }
        });

        // 비밀번호 변경 폼 이벤트
        document.getElementById('change-password-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const currentPw = document.getElementById('modal-current-pw').value;
            const newPw = document.getElementById('modal-new-pw').value;

            if (suggestionSystem.changePassword(currentPw, newPw)) {
                suggestionSystem.closePasswordModal();
            }
        });
    </script>
</body>
</html>
