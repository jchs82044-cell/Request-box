<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학급 소통 & 미니 게임 공간</title>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2, h3 {
            color: #333;
            text-align: center;
        }
        .hidden {
            display: none !important;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 14px;
            color: #555;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #4a90e2;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #357abd;
        }
        .error-msg {
            color: #e74c3c;
            font-size: 13px;
            text-align: center;
            margin-top: 10px;
        }
        
        /* 탭 메뉴 스타일 */
        .tab-menu {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }
        .tab-btn {
            background: none;
            border: none;
            font-size: 14px;
            font-weight: bold;
            color: #888;
            cursor: pointer;
            padding: 5px 10px;
            width: auto;
        }
        .tab-btn.active {
            color: #4a90e2;
            border-bottom: 2px solid #4a90e2;
        }
        
        /* 카드형 아이템 스타일 */
        .item-card {
            background: #f9f9f9;
            border-left: 4px solid #4a90e2;
            padding: 10px 15px;
            margin-bottom: 10px;
            border-radius: 4px;
            font-size: 13px;
        }
        .item-card p {
            margin: 5px 0 0 0;
            color: #444;
            word-break: break-all;
        }
        
        /* 상단 프로필 및 로그아웃 영역 */
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background: #eef2f7;
            padding: 10px 15px;
            border-radius: 8px;
        }
        .header-bar span {
            font-size: 14px;
            font-weight: bold;
            color: #333;
        }
        .logout-btn {
            background-color: #e74c3c;
            width: auto;
            padding: 5px 10px;
            font-size: 12px;
        }
        .logout-btn:hover {
            background-color: #c0392b;
        }

        /* 게임 스타일 */
        #dinoCanvas {
            background: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 6px;
            display: block;
            margin: 0 auto 10px auto;
        }
        .game-info {
            text-align: center;
            font-weight: bold;
            margin-bottom: 10px;
            color: #333;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- [1] 로그인 섹션 -->
        <div id="login-section">
            <h2>학급 시스템 로그인</h2>
            <div class="form-group">
                <label for="student-id">학번 (예: 20701 ~ 20729)</label>
                <input type="text" id="student-id" placeholder="학번을 입력하세요">
            </div>
            <div class="form-group">
                <label for="student-pw">비밀번호 (최초 기본: 1111)</label>
                <input type="password" id="student-pw" placeholder="비밀번호를 입력하세요">
            </div>
            <button id="login-btn">로그인</button>
            <div id="login-msg" class="error-msg"></div>
        </div>

        <!-- [2] 메인 대시보드 섹션 -->
        <div id="main-section" class="hidden">
            <div class="header-bar">
                <span id="welcome-title">환영합니다!</span>
                <button id="logout-btn" class="logout-btn">로그아웃</button>
            </div>

            <!-- 탭 네비게이션 -->
            <div class="tab-menu">
                <button class="tab-btn active" data-target="suggestion-tab">건의함</button>
                <button class="tab-btn" data-target="game-tab">공룡 게임</button>
                <button class="tab-btn" data-target="ranking-tab">랭킹</button>
                <button class="tab-btn" data-target="mypage-tab">내정보/비번변경</button>
            </div>

            <!-- 탭 1: 건의함 -->
            <div id="suggestion-tab" class="tab-content">
                <h3>학급 건의함</h3>
                <div class="form-group">
                    <textarea id="suggestion-input" rows="3" placeholder="선생님이나 학급 친구들에게 하고 싶은 건의사항을 남겨주세요."></textarea>
                </div>
                <button id="submit-suggestion" style="margin-bottom: 15px;">건의 등록</button>
                <div id="suggestion-list">
                    <!-- 건의사항 목록이 동적으로 들어감 -->
                </div>
            </div>

            <!-- 탭 2: 공룡 게임 -->
            <div id="game-tab" class="tab-content hidden">
                <h3>공룡 점프 게임</h3>
                <div class="game-info" id="dino-score">점수: 0</div>
                <canvas id="dinoCanvas" width="300" height="150"></canvas>
                <button id="game-action-btn">게임 시작 / 점프</button>
            </div>

            <!-- 탭 3: 랭킹 -->
            <div id="ranking-tab" class="tab-content hidden">
                <h3>게임 랭킹 TOP 5</h3>
                <div id="ranking-list">
                    <!-- 랭킹 목록이 동적으로 들어감 -->
                </div>
            </div>

            <!-- 탭 4: 내 정보 및 비밀번호 변경 -->
            <div id="mypage-tab" class="tab-content hidden">
                <h3>비밀번호 변경</h3>
                <div class="form-group">
                    <label for="current-pw">현재 비밀번호</label>
                    <input type="password" id="current-pw" placeholder="현재 비밀번호 입력">
                </div>
                <div class="form-group">
                    <label for="new-pw">새 비밀번호</label>
                    <input type="password" id="new-pw" placeholder="새 비밀번호 입력">
                </div>
                <button id="change-pw-btn">비밀번호 변경하기</button>
                <div id="pw-msg" style="font-size: 13px; text-align: center; margin-top: 10px;"></div>
            </div>
        </div>
    </div>

    <!-- 자바스크립트 연결 -->
    <script src="script.js"></script>
</body>
</html>
