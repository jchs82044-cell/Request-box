<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학교 건의함 & 미니게임 (구글 시트 연동)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- [1] 로그인 화면 -->
    <div id="login-section" class="container">
        <h2>🏫 학생 로그인</h2>
        <p class="subtitle">학번 (20701 ~ 20729)과 비밀번호를 입력하세요.</p>
        <input type="text" id="student-id" placeholder="학번 (예: 20701)" maxlength="5">
        <input type="password" id="student-pw" placeholder="비밀번호 (초기: 1111)">
        <button id="login-btn">로그인</button>
        <p id="login-msg" class="error-msg"></p>
    </div>

    <!-- [2] 메인 서비스 화면 -->
    <div id="main-section" class="container hidden">
        <header>
            <h1 id="welcome-title">환영합니다!</h1>
            <button id="logout-btn" class="sub-btn">로그아웃</button>
        </header>

        <!-- 탭 메뉴 버튼 -->
        <div class="tab-menu">
            <button class="tab-btn active" data-target="suggestion-tab">📢 건의함</button>
            <button class="tab-btn" data-target="game-tab">🎮 미니게임</button>
        </div>

        <!-- 건의함 탭 -->
        <div id="suggestion-tab" class="tab-content active">
            <h3>학교에 바라는 점을 남겨주세요</h3>
            <textarea id="suggestion-input" placeholder="건의 내용을 입력하세요..."></textarea>
            <button id="submit-suggestion">건의 등록</button>
            
            <div class="list-container">
                <h4>📋 건의함 목록</h4>
                <div id="suggestion-list">불러오는 중...</div>
            </div>
        </div>

        <!-- 미니게임 탭 -->
        <div id="game-tab" class="tab-content hidden">
            <h3>⚡ 5초 동안 광클하기!</h3>
            <p>버튼을 최대한 많이 눌러 점수를 올리세요.</p>
            <div class="game-box">
                <div id="timer">남은 시간: 5초</div>
                <div id="score">점수: 0</div>
                <button id="game-action-btn">게임 시작</button>
            </div>
            <div class="list-container">
                <h4>🏆 랭킹</h4>
                <div id="ranking-list">불러오는 중...</div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
